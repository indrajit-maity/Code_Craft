services:
  postgres:
    image: postgres:17
    container_name: code-review-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # One-shot job: applies Prisma migrations, then exits.
  migrate:
    build:
      context: ./server
      target: migrate
    container_name: code-review-migrate
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy

  server:
    build:
      context: ./server
      target: runtime
    container_name: code-review-server
    restart: unless-stopped
    stop_grace_period: 15s
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 5001
      SERVER_PORT: 5001
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      CORS_ORIGINS: ${CORS_ORIGINS:-}

      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

      JWT_ISSUER: ${JWT_ISSUER:?set JWT_ISSUER in .env}
      JWT_AUDIENCE: ${JWT_AUDIENCE:?set JWT_AUDIENCE in .env}
      JWT_KEY_ID: ${JWT_KEY_ID:-key-1}
      JWT_PRIVATE_KEY_B64: ${JWT_PRIVATE_KEY_B64:?set JWT_PRIVATE_KEY_B64 in .env}
      JWT_PUBLIC_KEY_B64: ${JWT_PUBLIC_KEY_B64:?set JWT_PUBLIC_KEY_B64 in .env}
    ports:
      - "127.0.0.1:${SERVER_PORT:-5001}:5001"
    depends_on:
      migrate:
        condition: service_completed_successfully

  client:
    build:
      context: ./client
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:5001}
        VITE_SOCKET_URL: ${VITE_SOCKET_URL:-http://localhost:5001}
    container_name: code-review-client
    restart: unless-stopped
    ports:
      - "${CLIENT_PORT:-8080}:80"
    depends_on:
      server:
        condition: service_healthy

volumes:
  postgres_data: